name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: minicode

      # minicore di-vendor ke minicode/vendor/minicore (lihat scripts/vendor-minicore.ts),
      # jadi `bun install` TIDAK lagi butuh sibling. Checkout ini hanya untuk
      # memverifikasi vendor masih sinkron dengan sumbernya + menjalankan test kernel.
      - uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: startupmini/minicore
          path: minicore

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: minicode/node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('minicode/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        working-directory: minicode
        run: bun install

      # CATATAN: `vendor:check` sengaja TIDAK lagi jadi gate sejak vendor
      # di-unfreeze di v0.16.0 (lihat vendor/minicore/VENDOR.md). Host kini boleh
      # mengedit vendor langsung, jadi hash pin hanya referensi historis — bukan
      # invarian yang harus gagal di CI. Provenance tetap bisa diperiksa manual
      # lewat `bun run vendor:check` saat sibling ../minicore tersedia.
      - name: Typecheck
        working-directory: minicode
        run: bun x tsc --noEmit

      - name: Lint (biome)
        working-directory: minicode
        run: bun run lint

      # F2: step ini HANYA subset invariant p*.test.ts/p15..p24 — BUKAN suite
      # penuh. Suite penuh yang WAJIB di job utama dijalankan oleh step
      # "Full test suite + coverage gate (aggregate)" di bawah (coverage-gate
      # memanggil `bun test --coverage` pada seluruh test/ dan menggagalkan gate
      # bila ada test gagal — lihat scripts/coverage-gate.ts). Tidak ada `bun
      # test` penuh kedua supaya kerja tidak diduplikasi.
      - name: Invariant suite (p*.test.ts + p15–p24)
        working-directory: minicode
        # [Fase 9 / 9.3 CTL-06] Sertakan suite invariant p15..p21 (paritas CI):
        # jangan biarkan suite hardening terbaru hanya berjalan di mesin dev.
        run: >-
          bun test
          test/p*.test.ts
          test/p15-*.test.ts
          test/p16-*.test.ts
          test/p17-*.test.ts
          test/p18-*.test.ts
          test/p19-*.test.ts
          test/p20-*.test.ts
          test/p21-*.test.ts
          test/p22-*.test.ts
          test/p23-*.test.ts
          test/p24-*.test.ts

      # Evaluator kualitas murni: input invalid/fake harus gagal tanpa provider
      # atau panggilan berbayar. `gate:eval` live tetap memakai artifact nyata.
      - name: Deterministic eval gate tests
        working-directory: minicode
        run: bun test test/eval-gate.test.ts

      # Regressions untuk batas permission, provider, provenance memori,
      # update, dan hasil pencarian tanpa embedding harus ikut PR CI.
      - name: Remediation regression tests
        working-directory: minicode
        run: >-
          bun test
          test/ctl07-permission-fail-closed.test.ts
          test/provider-sse-bounds.test.ts
          test/provider-retry-output.test.ts
          test/memory-provenance-auth.test.ts
          test/memory-no-embedding-call.test.ts
          test/docker-cleanup.test.ts
          test/update-auto.test.ts
          test/git-commit-index.test.ts
          test/git-filter-process.test.ts
          test/web-search-boundary.test.ts
          test/tool-context.test.ts
          test/release-workflow.test.ts

      # Gate agregat nyata. `bun test --coverage` sendirian selalu lulus —
      # threshold Bun dievaluasi per-file sehingga tak bisa dipakai sebagai gate.
      # F2: ini JUGA satu-satunya jalannya SUITE PENUH di job utama: tanpa
      # `--report`, coverage-gate menjalankan `bun test --coverage` ke seluruh
      # test/, dan status test + liputan sama-sama menggagalkan gate. Karena itu
      # step ini bernama eksplisit "Full test suite + ...": ia wajib lulus, bukan
      # pelengkap opsional.
      - name: Full test suite + coverage gate (aggregate)
        working-directory: minicode
        run: bun run gate:coverage

      # grep punya dua jalur (ripgrep + fallback walker). CI runner punya rg,
      # jadi jalur fallback juga diuji eksplisit agar tak diam-diam rusak.
      - name: Test with JS grep engine (fallback path)
        working-directory: minicode
        env:
          MINICODE_GREP_ENGINE: js
        run: bun test test/phase1-tools.test.ts test/tools.test.ts

      # Gate keamanan: korpus 62 pola serangan + 24 perintah sah (sumber angka:
      # experiments/bash-bypass-probe.ts). Exit 1 bila ada bypass ATAU
      # over-block, jadi regresi ke dua arah tertangkap.
      - name: Bash bypass probe (auto)
        working-directory: minicode
        run: bun experiments/bash-bypass-probe.ts

      - name: Bash bypass probe (allowlist)
        working-directory: minicode
        run: bun experiments/bash-bypass-probe.ts --mode allowlist

      # Eksperimen ekstrem (fuzz multi-seed + stress + adversarial + docker)
      # PINDAH ke slow.yml (nightly + manual): stokastik/fluktuatif antar run,
      # kegagalannya sinyal investigasi bukan penolakan PR. Di sini cukup
      # korpus deterministik di atas + smoke + audit harness.
      # Gate distribusi: tarball harus memuat semua yang dibutuhkan runtime dan
      # tidak memuat rahasia. Kegagalan `files` hanya terlihat setelah publish
      # kalau tidak diperiksa di sini.
      - name: Pack check (npm tarball)
        working-directory: minicode
        run: bun run gate:pack

      - name: Benchmark smoke (fake provider)
        working-directory: minicode
        run: bun run bench:smoke

      - name: Confirm fake smoke cannot satisfy eval gate
        working-directory: minicode
        shell: bash
        run: |
          if output="$(bun run gate:eval --results bench/results.json 2>&1)"; then
            echo "$output"
            echo "fake smoke output unexpectedly passed gate:eval"
            exit 1
          fi
          if ! grep -Fq "hasil --fake hanya untuk smoke" <<<"$output"; then
            echo "$output"
            echo "gate:eval failed without rejecting fake smoke evidence"
            exit 1
          fi

      # Audit harness deterministik (tanpa API key): safety/guard/jail/budget.
      - name: Harness audit (60 checks)
        working-directory: minicode
        run: bun run audit:harness

      - name: Telemetry gate (resolve rate target, mode legacy disengaja)
        working-directory: minicode
        # F2: traces.jsonl HANYA ditulis oleh runtime sesi nyata (cli/index.ts →
        # writeTrace). CI menjalankan test/gate, bukan sesi interaktif, jadi
        # berkas itu tidak pernah ada di checkout bersih — --allow-missing di sini
        # DISENGAJA agar nol data tidak dilaporkan sebagai kegagalan deterministik.
        # Gate lokal tanpa flag tetap fail-closed (data wajib ada & ≥3 run); jalur
        # STRICT-nya diuji nyata oleh step berikut memakai artifact sintetis.
        run: bun run gate:telemetry -- --allow-missing

      # F2: uji jalur strict gate:telemetry terhadap artifact NYATA di disk,
      # bukan sekadar ketiadaan berkas. 3 run dengan rate 0,67 ≥ 0,3 harus lulus;
      # artifact 1 baris harus ditolak (minimal 3 run). Ini membuktikan flag
      # --allow-missing di step atas tidak menyembunyikan gate yang rusak.
      - name: Telemetry gate (strict, artifact sintetis)
        working-directory: minicode
        shell: bash
        run: |
          tmp="$(mktemp -d)"
          mkdir -p "$tmp/.minicode"
          printf '%s\n' '{"ok":true}' '{"ok":true}' '{"ok":false}' > "$tmp/.minicode/traces.jsonl"
          bun scripts/telemetry-gate.ts "$tmp"
          printf '%s\n' '{"ok":true}' > "$tmp/.minicode/traces.jsonl"
          if bun scripts/telemetry-gate.ts "$tmp"; then
            echo "strict telemetry gate unexpectedly passed on sparse artifact"
            exit 1
          fi

      - name: Test minicore
        working-directory: minicore
        continue-on-error: true
        run: bun test

  # Smoke Windows (temuan audit F2): jalur khusus Windows — pelepasan caret dan
  # %VAR% cmd.exe, junction/symlink owned-state, fsutil/mklink/hardlink, jail
  # path case-insensitive — TIDAK PERNAH dilihat job ubuntu, sehingga regresinya
  # dulu hanya ketahuan di mesin dev (dan probe PTY/ConPTY di sebagian mesin
  # Windows memang rusak; lihat test/helpers/pty-harness.ts).
  # Suite penuh tetap milik job ubuntu; di sini subset yang menyentuh jalur
  # Windows (terverifikasi hijau di Windows: 337 pass / 3 skip / 0 fail, ~4 dtk).
  ci-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Install dependencies
        run: bun install
      - name: Typecheck
        run: bun x tsc --noEmit
      - name: Lint (biome)
        run: bun run lint
      # [PROMPT 06 · Area F] `shell: bash` WAJIB di step test Windows: shell
      # default pwsh TIDAK mengekspansi glob, jadi `test/p15-*.test.ts` dsb.
      # menjadi filter literal yang tidak cocok file mana pun — seluruh suite
      # p15..p24 dilewati diam-diam (terverifikasi lokal: tanpa ekspansi,
      # `bun test test/p15-*.test.ts` menjalankan 0 file dari pola itu). Bash
      # di runner windows-latest mengekspansi sama seperti job ubuntu.
      - name: Test jalur Windows (guard cmd.exe, jail, permission, tool, render)
        shell: bash
        run: >-
          bun test test/bash-guard-escaping.test.ts test/phase2-security.test.ts
          test/permission-matrix.test.ts test/deny-reason.test.ts
          test/jail-realpath.test.ts test/safe-open.test.ts test/tool-toctou.test.ts
          test/width.test.ts test/sanitize.test.ts test/tui-geometry.test.ts
          test/cli-subcommands.test.ts
          test/p15-*.test.ts test/p16-*.test.ts test/p17-*.test.ts
          test/p18-*.test.ts test/p19-*.test.ts test/p20-*.test.ts
          test/p21-*.test.ts test/p22-*.test.ts
          test/p23-*.test.ts
          test/p24-*.test.ts
      - name: Bash bypass probe (auto)
        run: bun experiments/bash-bypass-probe.ts
      - name: Pack check (npm tarball)
        run: bun run gate:pack
