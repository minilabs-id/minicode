name: Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require version tag ref
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" != "tag" || ! "${GITHUB_REF}" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Publish requires a semantic-version v* tag; refusing ${GITHUB_REF}"
            exit 1
          fi
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [[ "${GITHUB_REF}" != "refs/tags/v${PKG_VERSION}" ]]; then
            echo "Tag ${GITHUB_REF#refs/tags/v} != package.json ${PKG_VERSION} — abort"
            exit 1
          fi
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - name: Install
        run: bun install --frozen-lockfile
      # `vendor:check` bukan gate sejak vendor di-unfreeze di v0.16.0
      # (vendor/minicore/VENDOR.md); jangan blokir rilis karenanya.
      - name: Typecheck
        run: bun x tsc --noEmit
      - name: Lint
        run: bun run lint
      # `gate:coverage` sudah menjalankan `bun test --coverage` penuh; jangan duplikasi step `bun test`.
      - name: Coverage gate
        run: bun run gate:coverage
      - name: Pack check
        run: bun run gate:pack
      - name: Bash bypass gate
        run: bun run gate:bash
      - name: Benchmark smoke
        run: bun run bench:smoke
      - name: Harness evaluation
        run: bun run audit:harness
      - name: Telemetry gate (--allow-missing + strict self-test)
        shell: bash
        run: |
          bun run gate:telemetry -- --allow-missing
          tmp="$(mktemp -d)"
          mkdir -p "$tmp/.minicode"
          printf '%s\n' '{"ok":true}' '{"ok":true}' '{"ok":false}' > "$tmp/.minicode/traces.jsonl"
          bun scripts/telemetry-gate.ts "$tmp"
          printf '%s\n' '{"ok":true}' > "$tmp/.minicode/traces.jsonl"
          if bun scripts/telemetry-gate.ts "$tmp"; then
            echo "strict telemetry gate unexpectedly passed on sparse artifact"
            exit 1
          fi
      - name: Publish to npm
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
